  <div class="w-full max-w-3xl">
    <!-- Card -->

      <div class="p-8 space-y-8">
        <!-- Drag & Drop Area -->
        <div id="dropZone" class="drop-zone border-4 border-dashed border-gray-300 rounded-2xl p-12 text-center cursor-pointer hover:border-indigo-500 transition-all duration-300">
          <input type="file" id="imageInput" accept="image/*" class="hidden" />
          <div id="uploadArea">
            <svg class="mx-auto h-20 w-20 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/>
            </svg>
            <p class="mt-4 text-xl font-medium text-gray-700">Drop your image here or <span class="text-indigo-600 font-bold underline">browse</span></p>
            <p class="text-sm text-gray-500 mt-2">Supports JPG, PNG, WebP, GIF</p>
          </div>

          <!-- Preview Area -->
          <div id="previewArea" class="hidden mt-6">
            <img id="previewImg" class="max-h-96 mx-auto rounded-xl shadow-lg" />
            <button id="removeImg" class="mt-4 text-red-600 hover:text-red-800 font-medium">Remove Image</button>
          </div>
        </div>

        <!-- Settings -->
        <div id="settings" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Page Size</label>
            <select id="pageSize" class="w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 outline-none text-gray-700">
              <option value="a4">A4 (210 × 297 mm)</option>
              <option value="a3">A3 (297 × 420 mm)</option>
              <option value="a5">A5 (148 × 210 mm)</option>
              <option value="letter">Letter (8.5 × 11 in)</option>
              <option value="legal">Legal (8.5 × 14 in)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Fit Mode</label>
            <select id="fitMode" class="w-full px-5 py-3 border border-gray-300 rounded-xl focus:ring-4 focus:ring-indigo-200 focus:border-indigo-500 outline-none text-gray-700">
              <option value="fit">Fit to Page (Recommended)</option>
              <option value="original">Original Size (May overflow)</option>
            </select>
          </div>
        </div>

        <!-- Convert Button -->
        <div class="text-center">
          <button id="convertBtn" disabled class="px-12 py-5 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold text-xl rounded-2xl shadow-lg hover:shadow-2xl transform hover:scale-105 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none">
            <span id="btnText">Convert to PDF</span>
            <span id="loadingText" class="hidden">Generating PDF...</span>
          </button>
        </div>

        <div id="fileName" class="text-center text-sm text-gray-600"></div>
      </div>
    </div>

    <!-- Footer -->
    <p class="text-center text-white/80 mt-8 text-sm">Made with ❤️ using Tailwind & jsPDF</p>
  </div>

  <script>
    const { jsPDF } = window.jspdf;

    const dropZone = document.getElementById('dropZone');
    const imageInput = document.getElementById('imageInput');
    const previewArea = document.getElementById('previewArea');
    const previewImg = document.getElementById('previewImg');
    const uploadArea = document.getElementById('uploadArea');
    const removeImg = document.getElementById('removeImg');
    const settings = document.getElementById('settings');
    const convertBtn = document.getElementById('convertBtn');
    const btnText = document.getElementById('btnText');
    const loadingText = document.getElementById('loadingText');
    const fileName = document.getElementById('fileName');
    const pageSizeSelect = document.getElementById('pageSize');
    const fitModeSelect = document.getElementById('fitMode');

    let selectedFile = null;

    // Trigger file input
    dropZone.addEventListener('click', () => imageInput.click());

    // Drag & Drop Events
    ['dragover', 'dragenter'].forEach(event => {
      dropZone.addEventListener(event, e => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'dragend'].forEach(event => {
      dropZone.addEventListener(event, () => {
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
      }
    });

    imageInput.addEventListener('change', () => {
      if (imageInput.files.length) {
        handleFile(imageInput.files[0]);
      }
    });

    function handleFile(file) {
      if (!file.type.startsWith('image/')) {
        alert('Please upload a valid image file.');
        return;
      }

      selectedFile = file;
      fileName.textContent = `Selected: ${file.name}`;

      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewArea.classList.remove('hidden');
        uploadArea.classList.add('hidden');
        settings.classList.remove('hidden');
        convertBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    removeImg.addEventListener('click', () => {
      selectedFile = null;
      previewArea.classList.add('hidden');
      uploadArea.classList.remove('hidden');
      settings.classList.add('hidden');
      convertBtn.disabled = true;
      fileName.textContent = '';
      imageInput.value = '';
    });

    convertBtn.addEventListener('click', () => {
      if (!selectedFile) return;

      btnText.classList.add('hidden');
      loadingText.classList.remove('hidden');
      convertBtn.disabled = true;

      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => {
          const format = pageSizeSelect.value;
          const orientation = img.width > img.height ? 'l' : 'p';
          const doc = new jsPDF({ orientation, unit: 'mm', format });

          const pageWidth = doc.internal.pageSize.getWidth();
          const pageHeight = doc.internal.pageSize.getHeight();

          let width, height, x = 0, y = 0;

          if (fitModeSelect.value === 'fit') {
            const ratio = Math.min(pageWidth / img.width, pageHeight / img.height);
            width = img.width * ratio * 0.35278;  // px to mm
            height = img.height * ratio * 0.35278;
            x = (pageWidth - width) / 2;
            y = (pageHeight - height) / 2;
          } else {
            width = img.width * 0.264583;   // 1px = 0.264583 mm at 96dpi
            height = img.height * 0.264583;
            x = 10; y = 10;
          }

          const imgType = selectedFile.type.includes('png') ? 'PNG' : 'JPEG';
          doc.addImage(e.target.result, imgType, x, y, width, height);
          doc.save(`${selectedFile.name.split('.')[0]}_converted.pdf`);

          setTimeout(() => {
            btnText.classList.remove('hidden');
            loadingText.classList.add('hidden');
            convertBtn.disabled = false;
          }, 1000);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(selectedFile);
    });
  </script>
