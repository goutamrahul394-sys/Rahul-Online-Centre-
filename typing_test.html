
<!DOCTYPE html>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Hind:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .hindi-text {
            font-family: 'Hind', sans-serif;
        }
        .typing-cursor {
            border-left: 2px solid #3b82f6;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .correct {
            color: #10b981;
        }
        .incorrect {
            color: #ef4444;
            text-decoration: underline;
        }
        .current {
            background-color: #dbeafe;
        }
        .typed {
            color: #6b7280;
        }
    </style>
</head>

    <div class="w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white p-6">
            <h1 class="text-3xl font-bold text-center">Multilingual Typing Speed Tester</h1>
            <p class="text-center mt-2 opacity-90">Test your typing speed in both English and Hindi</p>
        </div>
        
        <!-- Language Selection -->
        <div class="p-6 border-b border-gray-200">
            <div class="flex justify-center space-x-4">
                <button id="englishBtn" class="language-btn active px-4 py-2 rounded-lg bg-blue-600 text-white font-medium">
                    <i class="fas fa-language mr-2"></i>English
                </button>
                <button id="hindiBtn" class="language-btn px-4 py-2 rounded-lg bg-gray-200 text-gray-700 font-medium">
                    <i class="fas fa-language mr-2"></i>हिन्दी
                </button>
            </div>
        </div>
        
        <!-- Stats Section -->
        <div class="p-6 grid grid-cols-2 md:grid-cols-4 gap-4 bg-gray-50">
            <div class="stat-card bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-gray-500">Time</p>
                <p id="timer" class="text-2xl font-bold text-blue-600">60s</p>
            </div>
            <div class="stat-card bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-gray-500">WPM</p>
                <p id="wpm" class="text-2xl font-bold text-green-600">0</p>
            </div>
            <div class="stat-card bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-gray-500">Accuracy</p>
                <p id="accuracy" class="text-2xl font-bold text-purple-600">0%</p>
            </div>
            <div class="stat-card bg-white p-4 rounded-lg shadow text-center">
                <p class="text-sm text-gray-500">Errors</p>
                <p id="errors" class="text-2xl font-bold text-red-600">0</p>
            </div>
        </div>
        
        <!-- Text Display -->
        <div class="p-6">
            <div id="textDisplay" class="text-lg md:text-xl leading-relaxed p-4 bg-gray-100 rounded-lg h-40 overflow-y-auto mb-4 hindi-text">
                <!-- Text will be inserted here by JavaScript -->
            </div>
            
            <!-- Input Area -->
            <div class="relative">
                <textarea 
                    id="typingInput" 
                    class="w-full p-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none h-32"
                    placeholder="Start typing here..."
                    disabled
                ></textarea>
                <div class="absolute bottom-4 right-4 text-sm text-gray-500">
                    <span id="charCount">0</span> characters
                </div>
            </div>
            
            <!-- Controls -->
            <div class="flex flex-wrap justify-between mt-6">
                <div class="flex space-x-2">
                    <button id="startBtn" class="px-6 py-3 bg-green-600 text-white rounded-lg font-medium hover:bg-green-700 transition">
                        <i class="fas fa-play mr-2"></i>Start Test
                    </button>
                    <button id="resetBtn" class="px-6 py-3 bg-gray-600 text-white rounded-lg font-medium hover:bg-gray-700 transition" disabled>
                        <i class="fas fa-redo mr-2"></i>Reset
                    </button>
                </div>
                <div class="mt-4 md:mt-0">
                    <label class="inline-flex items-center">
                        <input type="checkbox" id="soundToggle" class="rounded text-blue-600" checked>
                        <span class="ml-2 text-gray-700">Sound on error</span>
                    </label>
                </div>
            </div>
        </div>
        
        <!-- Results Section -->
        <div id="results" class="p-6 bg-blue-50 hidden">
            <h2 class="text-2xl font-bold text-center text-blue-800 mb-4">Test Results</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded-lg shadow text-center">
                    <p class="text-lg font-medium text-gray-700">Typing Speed</p>
                    <p id="resultWpm" class="text-3xl font-bold text-green-600 mt-2">0 WPM</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow text-center">
                    <p class="text-lg font-medium text-gray-700">Accuracy</p>
                    <p id="resultAccuracy" class="text-3xl font-bold text-purple-600 mt-2">0%</p>
                </div>
                <div class="bg-white p-4 rounded-lg shadow text-center">
                    <p class="text-lg font-medium text-gray-700">Time Taken</p>
                    <p id="resultTime" class="text-3xl font-bold text-blue-600 mt-2">0s</p>
                </div>
            </div>
            <div class="mt-6 text-center">
                <button id="retryBtn" class="px-6 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition">
                    <i class="fas fa-sync-alt mr-2"></i>Try Again
                </button>
            </div>
        </div>

    <!-- Footer -->
    <div class="mt-8 text-center text-gray-600">
        <p>Practice regularly to improve your typing speed and accuracy!</p>
    </div>

    <script>
        // Sample texts for typing test
        const englishTexts = [
            "The quick brown fox jumps over the lazy dog. This sentence contains all the letters in the English alphabet.",
            "Programming is the process of creating a set of instructions that tell a computer how to perform a task.",
            "Typing speed is measured in words per minute. Accuracy is equally important when it comes to typing.",
            "Practice makes perfect. Regular typing practice can significantly improve your speed and accuracy over time.",
            "The internet has revolutionized communication, making it easier to connect with people around the world."
        ];
        
        const hindiTexts = [
            "मैं घर जा रहा हूँ। आज मौसम बहुत सुहावना है और पक्षी चहचहा रहे हैं।",
            "भारत एक विविधतापूर्ण देश है जहाँ अनेक भाषाएँ बोली जाती हैं और विभिन्न संस्कृतियाँ पनपती हैं।",
            "प्रौद्योगिकी ने हमारे जीवन को पूरी तरह से बदल दिया है और दैनिक कार्यों को आसान बना दिया है।",
            "शिक्षा मनुष्य का सबसे बड़ा हथियार है जिसके द्वारा वह दुनिया को बदल सकता है।",
            "प्रकृति का सौंदर्य मन को शांति प्रदान करता है और आत्मा को तरोताजा कर देता है।"
        ];
        
        // DOM Elements
        const englishBtn = document.getElementById('englishBtn');
        const hindiBtn = document.getElementById('hindiBtn');
        const textDisplay = document.getElementById('textDisplay');
        const typingInput = document.getElementById('typingInput');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const retryBtn = document.getElementById('retryBtn');
        const timerElement = document.getElementById('timer');
        const wpmElement = document.getElementById('wpm');
        const accuracyElement = document.getElementById('accuracy');
        const errorsElement = document.getElementById('errors');
        const charCountElement = document.getElementById('charCount');
        const resultsSection = document.getElementById('results');
        const resultWpm = document.getElementById('resultWpm');
        const resultAccuracy = document.getElementById('resultAccuracy');
        const resultTime = document.getElementById('resultTime');
        const soundToggle = document.getElementById('soundToggle');
        
        // Variables
        let currentLanguage = 'english';
        let currentText = '';
        let timer;
        let timeLeft = 60;
        let isTestRunning = false;
        let startTime;
        let errors = 0;
        let correctChars = 0;
        let totalChars = 0;
        let wpmInterval;
        
        // Initialize the app
        function init() {
            setLanguage('english');
            setupEventListeners();
        }
        
        // Set up event listeners
        function setupEventListeners() {
            englishBtn.addEventListener('click', () => setLanguage('english'));
            hindiBtn.addEventListener('click', () => setLanguage('hindi'));
            startBtn.addEventListener('click', startTest);
            resetBtn.addEventListener('click', resetTest);
            retryBtn.addEventListener('click', resetTest);
            typingInput.addEventListener('input', handleTyping);
            typingInput.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace') {
                    e.preventDefault(); // Prevent default backspace behavior
                }
            });
        }
        
        // Set language and update UI
        function setLanguage(language) {
            currentLanguage = language;
            
            // Update language buttons
            if (language === 'english') {
                englishBtn.classList.remove('bg-gray-200', 'text-gray-700');
                englishBtn.classList.add('bg-blue-600', 'text-white');
                hindiBtn.classList.remove('bg-blue-600', 'text-white');
                hindiBtn.classList.add('bg-gray-200', 'text-gray-700');
                textDisplay.classList.remove('hindi-text');
            } else {
                hindiBtn.classList.remove('bg-gray-200', 'text-gray-700');
                hindiBtn.classList.add('bg-blue-600', 'text-white');
                englishBtn.classList.remove('bg-blue-600', 'text-white');
                englishBtn.classList.add('bg-gray-200', 'text-gray-700');
                textDisplay.classList.add('hindi-text');
            }
            
            // Reset test if running
            if (isTestRunning) {
                resetTest();
            }
            
            // Load new text
            loadNewText();
        }
        
        // Load a new random text
        function loadNewText() {
            const texts = currentLanguage === 'english' ? englishTexts : hindiTexts;
            const randomIndex = Math.floor(Math.random() * texts.length);
            currentText = texts[randomIndex];
            
            // Display text with spans for each character
            textDisplay.innerHTML = '';
            for (let i = 0; i < currentText.length; i++) {
                const charSpan = document.createElement('span');
                charSpan.textContent = currentText[i];
                charSpan.id = `char-${i}`;
                textDisplay.appendChild(charSpan);
            }
            
            // Reset input
            typingInput.value = '';
            charCountElement.textContent = '0';
            
            // Highlight first character
            document.getElementById('char-0').classList.add('current');
        }
        
        // Start the typing test
        function startTest() {
            if (isTestRunning) return;
            
            isTestRunning = true;
            startBtn.disabled = true;
            resetBtn.disabled = false;
            typingInput.disabled = false;
            typingInput.focus();
            
            // Reset stats
            timeLeft = 60;
            errors = 0;
            correctChars = 0;
            totalChars = 0;
            startTime = new Date();
            
            // Update UI
            updateStats();
            
            // Start timer
            timer = setInterval(updateTimer, 1000);
            
            // Start WPM calculation
            wpmInterval = setInterval(updateStats, 500);
        }
        
        // Update the timer
        function updateTimer() {
            timeLeft--;
            timerElement.textContent = `${timeLeft}s`;
            
            if (timeLeft <= 0) {
                endTest();
            }
        }
        
        // Handle typing input
        function handleTyping() {
            if (!isTestRunning) return;
            
            const typedText = typingInput.value;
            totalChars = typedText.length;
            charCountElement.textContent = totalChars;
            
            // Update character highlighting
            updateCharacterHighlighting(typedText);
            
            // Calculate and update stats
            updateStats();
        }
        
        // Update character highlighting based on typed text
        function updateCharacterHighlighting(typedText) {
            let newErrors = 0;
            let newCorrectChars = 0;
            
            for (let i = 0; i < currentText.length; i++) {
                const charElement = document.getElementById(`char-${i}`);
                charElement.classList.remove('correct', 'incorrect', 'current', 'typed');
                
                if (i < typedText.length) {
                    if (typedText[i] === currentText[i]) {
                        charElement.classList.add('correct');
                        newCorrectChars++;
                    } else {
                        charElement.classList.add('incorrect');
                        newErrors++;
                        
                        // Play error sound if enabled
                        if (soundToggle.checked) {
                            playErrorSound();
                        }
                    }
                    charElement.classList.add('typed');
                }
                
                if (i === typedText.length) {
                    charElement.classList.add('current');
                }
            }
            
            errors = newErrors;
            correctChars = newCorrectChars;
            
            // Check if user has completed the text
            if (typedText.length >= currentText.length) {
                endTest();
            }
        }
        
        // Play error sound
        function playErrorSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.value = 200;
            gainNode.gain.value = 0.1;
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 0.1);
        }
        
        // Update statistics
        function updateStats() {
            if (!isTestRunning) return;
            
            const elapsedTimeInMinutes = (new Date() - startTime) / 1000 / 60;
            const wpm = elapsedTimeInMinutes > 0 ? Math.round((correctChars / 5) / elapsedTimeInMinutes) : 0;
            const accuracy = totalChars > 0 ? Math.round(((totalChars - errors) / totalChars) * 100) : 0;
            
            wpmElement.textContent = wpm;
            accuracyElement.textContent = `${accuracy}%`;
            errorsElement.textContent = errors;
        }
        
        // End the test
        function endTest() {
            isTestRunning = false;
            clearInterval(timer);
            clearInterval(wpmInterval);
            typingInput.disabled = true;
            startBtn.disabled = false;
            
            // Calculate final stats
            const elapsedTime = 60 - timeLeft;
            const elapsedTimeInMinutes = elapsedTime / 60;
            const finalWpm = elapsedTimeInMinutes > 0 ? Math.round((correctChars / 5) / elapsedTimeInMinutes) : 0;
            const finalAccuracy = totalChars > 0 ? Math.round(((totalChars - errors) / totalChars) * 100) : 0;
            
            // Display results
            resultWpm.textContent = `${finalWpm} WPM`;
            resultAccuracy.textContent = `${finalAccuracy}%`;
            resultTime.textContent = `${elapsedTime}s`;
            resultsSection.classList.remove('hidden');
        }
        
        // Reset the test
        function resetTest() {
            isTestRunning = false;
            clearInterval(timer);
            clearInterval(wpmInterval);
            timeLeft = 60;
            timerElement.textContent = '60s';
            wpmElement.textContent = '0';
            accuracyElement.textContent = '0%';
            errorsElement.textContent = '0';
            charCountElement.textContent = '0';
            
            typingInput.value = '';
            typingInput.disabled = true;
            startBtn.disabled = false;
            resetBtn.disabled = true;
            
            resultsSection.classList.add('hidden');
            
            loadNewText();
        }
        
        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
